# Loki, single-binary, filesystem storage. Sized for one NAS and a handful of chatty
# containers -- there is no object store, no ring beyond this process, and no
# multi-tenancy.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Loki at `info` narrates every compaction and flush, and Alloy ships Loki's own output
  # back into Loki. At info that is the single loudest stream on the NAS, burying the
  # application errors this whole stack exists to surface.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # `from` is the date this schema becomes effective, not an install date -- it must be
    # in the past or Loki refuses to start. Only ever add a new entry with a future date;
    # editing this one orphans the chunks already written under it.
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  # 30 days. Enough to correlate a slow-burn problem across a few weeks without the
  # filesystem store growing without limit.
  retention_period: 720h

  # Loki reads the severity out of each line and attaches it as structured metadata
  # (`detected_level`) rather than as a label. A LABEL WOULD BE THE WRONG CHOICE: every
  # distinct label combination is a separate stream, so labelling by level multiplies the
  # stream count by five for no query benefit. Structured metadata filters just as well
  # and costs nothing in cardinality.
  #
  # This is the heuristic pass. config.alloy also extracts the level explicitly for the
  # Python services, whose format this would only usually get right; an explicitly
  # attached value takes precedence over this one.
  discover_log_levels: true
  allow_structured_metadata: true

  # Powers the volume/"log volume" panel in Grafana Explore.
  volume_enabled: true

  # A container that has been down a while replays its old lines on restart; accepting
  # them would file today's ingest under last week's index. A week of slack is generous
  # for a NAS that is rarely off longer than a reboot.
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  # WITHOUT THIS, `retention_period` ABOVE IS SILENTLY IGNORED and the volume grows
  # forever -- no warning, no error, exactly the failure the uncapped json-file driver
  # had. Retention is enforced by the compactor, not by the limit alone.
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  # Grace period between a chunk falling out of retention and being deleted. Leaves room
  # to notice a mistaken retention change before the data is gone.
  retention_delete_delay: 2h

analytics:
  reporting_enabled: false
